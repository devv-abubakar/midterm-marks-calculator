<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midterm Marks Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            background: radial-gradient(circle at top left, #1e293b, #0f172a); 
            min-height: 100vh; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 md:p-8">

    <div class="glass-card p-8 rounded-[2.5rem] shadow-2xl w-full max-w-lg transition-all duration-500">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Midterm Marks <span class="text-blue-600">Calculator</span></h2>
            <p class="text-slate-500 mt-2 font-medium">Convert your percentages into midterm score</p>
        </div>

        <div class="bg-blue-50/80 p-5 rounded-2xl mb-8 border border-blue-100">
            <h4 class="font-bold text-blue-900 text-sm mb-2 flex items-center">
                Istemal ka Tarika (Guide)
            </h4>
            <ul class="text-xs text-blue-800 space-y-2 font-medium">
                <li>• Tamam subjects ki percentages enter karein.</li>
                <li>• Har number ke baad <b class="text-blue-600">comma (,)</b> lazmi lagayein.</li>
            </ul>
        </div>
        
        <div class="mb-6">
            <label class="block text-sm font-bold text-slate-700 mb-2 ml-1 text-left">Enter Percentages:</label>
            <input type="text" id="percentages" placeholder="E.g. 50, 65, 40, 15" 
                class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10 outline-none transition-all duration-300 text-lg font-semibold text-slate-800">
        </div>

        <button onclick="calculate()" 
            class="w-full bg-slate-900 hover:bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-xl transform active:scale-[0.98] transition-all duration-300">
            Calculate Result
        </button>

        <div id="result" class="mt-8 hidden animate-[fadeIn_0.5s_ease-out]">
            <div id="statusAlert" class="mb-4 p-4 rounded-xl text-sm font-bold text-center"></div>

            <div class="grid grid-cols-2 gap-3 mb-4 text-center">
                <div class="p-3 bg-slate-50 rounded-2xl border border-slate-100">
                    <span class="block text-[10px] uppercase tracking-widest text-slate-400 font-bold">Subjects</span>
                    <span id="subCount" class="text-lg font-extrabold text-slate-800">0</span>
                </div>
                <div class="p-3 bg-slate-50 rounded-2xl border border-slate-100">
                    <span class="block text-[10px] uppercase tracking-widest text-slate-400 font-bold">Average</span>
                    <span id="avgPerc" class="text-lg font-extrabold text-blue-600">0%</span>
                </div>
            </div>

            <div class="p-8 bg-gradient-to-br from-blue-600 to-indigo-700 rounded-[2rem] text-center text-white shadow-2xl relative overflow-hidden">
                <div class="relative z-10">
                    <p class="text-blue-100 font-bold text-xs uppercase tracking-[0.2em] mb-3">Midterm Final Score</p>
                    <div class="flex items-baseline justify-center">
                        <span id="marks20" class="text-7xl font-black tracking-tighter">0.00</span>
                        <span class="text-2xl font-bold text-blue-200 ml-2">/ 20</span>
                    </div>
                    <div class="mt-6 pt-6 border-t border-white/10">
                        <p id="finalNote" class="text-sm font-medium leading-relaxed text-blue-50 bg-white/10 p-4 rounded-xl"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            const input = document.getElementById('percentages').value;
            const resDiv = document.getElementById('result');
            const alertDiv = document.getElementById('statusAlert');
            
            const values = input.split(',')
                                .map(v => parseFloat(v.trim()))
                                .filter(v => !isNaN(v));

            if (values.length === 0) {
                alert("Please enter valid percentages!");
                return;
            }

            // Logic for Fail/Pass subjects
            const failSubjects = values.filter(v => v < 20).length;
            if (failSubjects > 0) {
                alertDiv.className = "mb-4 p-4 rounded-xl text-sm font-bold text-center bg-red-100 text-red-700 border border-red-200";
                alertDiv.innerText = `Attention: You have ${failSubjects} subject(s) with less than 20% marks.`;
            } else {
                alertDiv.className = "mb-4 p-4 rounded-xl text-sm font-bold text-center bg-green-100 text-green-700 border border-green-200";
                alertDiv.innerText = "Congratulations! You're Pass";
            }

            const count = values.length;
            const sum = values.reduce((a, b) => a + b, 0);
            const average = sum / count;
            const marksOutOf20 = (average / 100) * 20;

            document.getElementById('subCount').innerText = count;
            document.getElementById('avgPerc').innerText = average.toFixed(2) + "%";
            
            const finalScore = marksOutOf20.toFixed(2);
            document.getElementById('marks20').innerText = finalScore;
            
            document.getElementById('finalNote').innerText = 
                "Finals mein aapky jo marks midterm k lgay gay wo " + finalScore + " hain 20 mein sy.";
            
            resDiv.classList.remove('hidden');
        }
    </script>

    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
