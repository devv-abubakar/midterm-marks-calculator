<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midterm Marks Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            background: radial-gradient(circle at top left, #1e293b, #0f172a); 
            min-height: 100vh; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 90%;
        }
        @media (min-width: 768px) {
            .glass-card { max-width: 500px; }
        }
        .result-card-premium {
            background: linear-gradient(to bottom right, #2563eb, #3730a3);
            border-radius: 2rem;
            padding: 2.5rem 1.5rem;
            color: white;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="p-4">

    <div class="glass-card p-6 md:p-8 rounded-[2rem] shadow-2xl">
        <div class="text-center mb-6">
            <h2 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight leading-tight">Midterm Marks <br><span class="text-blue-600">Calculator</span></h2>
            <p class="text-slate-500 mt-2 text-sm font-medium">Average % to 20 Marks Converter</p>
        </div>

        <div class="bg-blue-50/80 p-4 rounded-2xl mb-6 border border-blue-100 text-left text-xs text-blue-800 font-medium leading-relaxed">
            <h4 class="font-bold text-blue-900 text-sm mb-1">Istemal ka Tarika (Guide):</h4>
            <p>• Tamam subjects ki percentages enter karein.<br>
            • Har number ke baad <b>comma (,)</b> lazmi lagayein.<br>
            • Example: 45, 60, 55, 70</p>
        </div>
        
        <div class="mb-6 text-left">
            <label class="block text-xs font-bold text-slate-700 mb-2 ml-1 uppercase tracking-wider">Enter Percentages:</label>
            <input type="text" id="percentages" placeholder="E.g. 50, 65, 72" 
                class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-blue-500 focus:bg-white outline-none transition-all text-lg font-semibold text-slate-800">
        </div>

        <button onclick="calculate()" 
            class="w-full bg-slate-900 hover:bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-xl transform active:scale-95 transition-all uppercase tracking-widest text-sm">
            Calculate Result
        </button>

        <div id="result" class="mt-8 hidden animate-fade">
            <div id="statusAlert" class="mb-6 p-4 rounded-xl text-sm font-bold text-center border text-center"></div>

            <div id="captureArea">
                <div class="result-card-premium relative overflow-hidden">
                    <div class="relative z-10">
                        <p class="text-blue-100 font-bold text-[10px] md:text-xs uppercase tracking-[0.3em] mb-4 opacity-90">Midterm Final Score</p>
                        <div class="flex items-center justify-center space-x-1">
                            <span id="marks20" class="text-7xl md:text-8xl font-black tracking-tighter leading-none text-white">0.00</span>
                            <span class="text-3xl md:text-4xl font-bold text-blue-200/60 mt-4 leading-none">/20</span>
                        </div>
                        
                        <div class="mt-8 pt-6 border-t border-white/10 text-left">
                            <div class="text-[10px] text-blue-100 space-y-1 mb-4 bg-black/20 p-3 rounded-xl">
                                <p>• Final: 60 | Mid: 20 | Quiz: 10 | Assign: 5 | GDB: 5</p>
                            </div>
                            <div id="predictionBox" class="text-xs md:text-sm font-medium leading-relaxed text-blue-50 bg-white/10 p-4 rounded-xl italic"></div>
                        </div>
                    </div>
                </div>
            </div>

            <button onclick="shareOnWhatsApp()" class="mt-6 w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-3 transition-all shadow-xl active:scale-95 text-sm uppercase tracking-wide">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                Share on WhatsApp
            </button>
        </div>
    </div>

    <script>
        function calculate() {
            const input = document.getElementById('percentages').value;
            const resDiv = document.getElementById('result');
            const alertDiv = document.getElementById('statusAlert');
            const predictionBox = document.getElementById('predictionBox');
            
            const values = input.split(',').map(v => v.trim()).filter(v => v !== "" && !isNaN(v)).map(v => parseFloat(v));
            if (values.length === 0) { alert("Please enter valid percentages!"); return; }

            const average = values.reduce((a, b) => a + b, 0) / values.length;
            const finalScore = parseFloat(((average / 100) * 20).toFixed(2));
            const req = Math.ceil(50 - (finalScore + 8 + 4 + 3));
            
            document.getElementById('marks20').innerText = finalScore;
            
            // Corrected Spelling: Suppose
            let msg = `Hum farz karte hain (Suppose) ke agar aapke Midterm mein <b>${finalScore}</b> marks hain, aur Quizzes(8), Assignments(4), GDB(3) marks aate hain... <br><br>`;
            if (req > 60) { msg += `Toh Finals mein 60 mein se **${req}** marks chahiye (Mushkil hai).`; }
            else if (req <= 0) { msg += `Toh Congratulations! Aap Finals se pehle hi 50 marks ka target pura kar chuke hain.`; }
            else { msg += `Toh aapko Pass hone ke liye Final paper mein 60 mein se kam az kam **${req}** marks chahiye honge.`; }

            predictionBox.innerHTML = msg;
            resDiv.classList.remove('hidden');
            
            const failSubjects = values.filter(v => v < 20).length;
            if (failSubjects > 0) {
                alertDiv.className = "mb-6 p-4 rounded-xl text-sm font-bold text-center bg-red-50 text-red-700 border-red-100 border";
                alertDiv.innerText = `Attention: ${failSubjects} subject(s) less than 20%.`;
            } else {
                alertDiv.className = "mb-6 p-4 rounded-xl text-sm font-bold text-center bg-green-50 text-green-700 border-green-100 border";
                alertDiv.innerText = "Congratulations! You're Pass";
            }
        }

        async function shareOnWhatsApp() {
            const captureArea = document.getElementById('captureArea');
            const canvas = await html2canvas(captureArea, { backgroundColor: '#1e293b', scale: 2 });
            
            // Browser image share support check
            canvas.toBlob(async (blob) => {
                const siteUrl = "https://devv-abubakar.github.io/midterm-marks-calculator/";
                // Corrected Spelling: Marks
                const shareText = "Ap bhi apna result ke marks is link par click kar ke calculate kar sakty hain. \n\n" + siteUrl;

                if (navigator.share && navigator.canShare && navigator.canShare({ files: [new File([blob], 'result.png', { type: 'image/png' })] })) {
                    // Mobile phones par direct image share hogi
                    const file = new File([blob], 'result.png', { type: 'image/png' });
                    await navigator.share({
                        files: [file],
                        title: 'Midterm Marks Result',
                        text: shareText
                    });
                } else {
                    // Agar browser image share support nahi karta (Desktop), toh text jayega
                    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`, '_blank');
                }
            });
        }
    </script>
</body>
</html>
